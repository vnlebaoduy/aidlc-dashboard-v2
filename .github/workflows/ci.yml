name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install server dependencies
        run: bun install --frozen-lockfile

      - name: Install web dependencies
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Install app UI dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/kirocrew/ui

      - name: Typecheck, lint, test and build
        run: bun run verify

      - name: The app backend must run on plain Node
        run: |
          ! grep -q "bun:" apps/kirocrew/backend/dist/server.js
          PORT=4399 AIDLC_LEDGER_ROOT=fixtures/reference node apps/kirocrew/backend/dist/server.js &
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:4399/health >/dev/null && break; sleep 0.3; done
          curl -sf http://127.0.0.1:4399/health
          curl -sf http://127.0.0.1:4399/api/apps/aidlc-ledger/model | head -c 80
